name: API — Build & Test

on:
  push:
    paths: ["api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["api/**", ".github/workflows/api.yml"]
  workflow_dispatch:

# O Delphi não é instalável em runners hospedados pelo GitHub.
# Este job exige um runner self-hosted Windows com Delphi (CE ou superior)
# instalado e a ferramenta Boss no PATH. Labels: self-hosted, windows, delphi.
jobs:
  build:
    runs-on: [self-hosted, windows, delphi]
    env:
      DELPHI_ROOT: C:\Program Files (x86)\Embarcadero\Studio\37.0

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Boss)
        working-directory: api
        shell: cmd
        run: boss install

      - name: Build API
        working-directory: api
        shell: cmd
        run: |
          call "%DELPHI_ROOT%\bin\rsvars.bat"
          msbuild HorseBridge.dproj /t:Build /p:Config=Release /p:Platform=Win32

      - name: Build tests
        working-directory: api/tests
        shell: cmd
        run: |
          call "%DELPHI_ROOT%\bin\rsvars.bat"
          msbuild HorseBridgeTests.dproj /t:Build /p:Config=Release /p:Platform=Win32

      - name: Run tests
        working-directory: api/tests
        shell: cmd
        run: Win32\Release\HorseBridgeTests.exe
